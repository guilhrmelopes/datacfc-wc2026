name: Atualizar odds GA% e SG% dos jogadores

# Odds são atualizadas localmente via automation/atualizar_odds.ps1 (Agendador de Tarefas).
# Este workflow fica apenas para execução manual de emergência.

on:
  workflow_dispatch:

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ODDSNOTIFIER_HEADLESS: "true"
      PYTHONPATH: ${{ github.workspace }}
      ODDS_MERGE: "1"
      ODDS_SKIP_WARMUP: "1"
      ODDS_CI_WAIT_MULT: "2.5"
      ODDS_DELAY_MIN: "12"
      ODDS_DELAY_MAX: "20"
      ODDS_TIMEOUT_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-odds.txt

      - name: Instalar dependências Python
        run: pip install -r requirements-odds.txt

      - name: Instalar Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Raspar odds GA% e SG% (rodada 1)
        id: scrape
        continue-on-error: true
        run: python -m src.scrapers.scraper_odds_jogadores

      - name: Validar cobertura minima antes do commit
        run: python automation/validar_odds.py

      - name: Commitar se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/public/data/odds_jogadores.json frontend/public/data/eventos_odds_rodada1.json

          git diff --cached --quiet || (
            git commit -m "bot: atualizar odds GA% e SG% dos jogadores [skip ci]" &&
            git push
          )

      - name: Falhar job se scrape nao extraiu dados
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper terminou com erro (dados anteriores preservados)."
          exit 1
