name: Atualizar odds GA% e SG% dos jogadores

# Roda 6× ao dia (horário aproximado BRT = UTC−3):
#  06h · 09h · 12h · 15h · 18h · 21h
# Aciona manual sempre disponível via "Run workflow".

on:
  schedule:
    - cron: '0  9 * * *'   # 06h BRT
    - cron: '0 12 * * *'   # 09h BRT
    - cron: '0 15 * * *'   # 12h BRT
    - cron: '0 18 * * *'   # 15h BRT
    - cron: '0 21 * * *'   # 18h BRT
    - cron: '0  0 * * *'   # 21h BRT
  workflow_dispatch:

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 24 partidas × ~3min

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ODDSNOTIFIER_HEADLESS: "true"
      PYTHONPATH: ${{ github.workspace }}
      ODDS_DELAY_MIN: "10"
      ODDS_DELAY_MAX: "18"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-odds.txt

      - name: Instalar dependências Python
        run: pip install -r requirements-odds.txt

      - name: Instalar Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Raspar odds GA% e SG% (rodada 1)
        run: python -m src.scrapers.scraper_odds_jogadores

      - name: Validar cobertura minima antes do commit
        run: |
          python3 - << 'PYEOF'
          import json
          import sys
          from pathlib import Path

          path = Path("frontend/public/data/odds_jogadores.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          odds = data.get("odds", {})
          total = len(odds)
          ga = sum(1 for v in odds.values() if v.get("ga_pct"))
          sg = sum(1 for v in odds.values() if v.get("sg_pct"))

          print(f"total={total} ga={ga} sg={sg}")
          if total < 500 or ga < 400 or sg < 400:
              print("Cobertura insuficiente — abortando commit.")
              sys.exit(1)
          PYEOF

      - name: Commitar se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/public/data/odds_jogadores.json frontend/public/data/eventos_odds_rodada1.json

          git diff --cached --quiet || (
            git commit -m "bot: atualizar odds GA% e SG% dos jogadores [skip ci]" &&
            git push
          )
