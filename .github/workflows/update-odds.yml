name: Atualizar odds GA% e SG% dos jogadores

# Odds são atualizadas automaticamente após cada update-copa.yml.
# Este workflow fica apenas para execução manual de emergência.

on:
  workflow_dispatch:

concurrency:
  group: update-odds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ODDSNOTIFIER_HEADLESS: "true"
      PYTHONPATH: ${{ github.workspace }}
      ODDS_MERGE: "1"
      ODDS_SKIP_WARMUP: "0"
      ODDS_CI_WAIT_MULT: "2.5"
      ODDS_DELAY_MIN: "12"
      ODDS_DELAY_MAX: "20"
      ODDS_TIMEOUT_MS: "60000"
      ODDS_SCRAPE_SELETIVO: "1"
      ODDS_SKIP_FRESCOS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-odds.txt

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Mercado + proximo adversario
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python automation/preparar_mercado_odds.py

      - name: Validar pipeline odds
        run: python automation/validar_pipeline_odds.py

      - name: Raspar e validar odds
        id: scrape
        run: python automation/executar_odds.py

      - name: Commitar se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            frontend/public/data/copa_estado.json \
            frontend/public/data/grupos_wc2026.json \
            frontend/public/data/classificacao_grupos.json \
            frontend/public/data/pontuacao_cedida.json \
            frontend/public/data/selecoes.json \
            frontend/public/data/jogadores_mercado.json \
            frontend/public/data/odds_jogadores.json \
            frontend/public/data/odds_eventos_armazenados.json \
            frontend/public/data/mapeamento_jogadores_odds.json \
            frontend/public/data/eventos_odds_rodada1.json

          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar."
            exit 0
          fi

          git commit -m "bot: atualizar mercado e odds GA%/SG% [skip ci]"

          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push falhou (tentativa ${attempt}/5) — aguardando..."
            sleep $((attempt * 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::error::git push falhou após 5 tentativas."
            exit 1
          fi

      - name: Falhar job se scrape nao extraiu dados
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper terminou com erro (dados anteriores preservados)."
          exit 1
