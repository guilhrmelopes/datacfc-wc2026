name: Atualizar status e fotos dos jogadores

on:
  schedule:
    - cron: '0 12 * * *'   # 09h BRT (UTC-3)
    - cron: '0 17 * * *'   # 14h BRT
    - cron: '0 0  * * *'   # 21h BRT
  workflow_dispatch:         # permite execução manual pelo painel do GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar status_id e foto_url dos jogadores
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, time, sys

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          # --- fotos-atletas ---
          try:
              fotos_data = fetch("https://provaveisdocartola.com.br/api/copa/fotos-atletas")
              foto_map = {int(aid): d["url"] for aid, d in fotos_data.get("atletas", {}).items()}
              print(f"Fotos disponíveis: {len(foto_map)}")
          except Exception as e:
              print(f"Aviso: não foi possível buscar fotos — {e}", file=sys.stderr)
              foto_map = {}

          # --- cartola-mercado (status) ---
          try:
              mercado = fetch(
                  "https://provaveisdocartola.com.br/api/copa/cartola-mercado?_="
                  + str(int(time.time() * 1000))
              )
              status_map = {a["atleta_id"]: a["status_id"] for a in mercado.get("atletas", [])}
              print(f"Status disponíveis: {len(status_map)}")
          except Exception as e:
              print(f"Aviso: não foi possível buscar status — {e}", file=sys.stderr)
              status_map = {}

          # --- atualizar JSON ---
          path = "frontend/public/data/jogadores_mercado.json"
          with open(path, encoding="utf-8") as f:
              jogadores = json.load(f)

          fotos_ok = status_ok = 0
          for j in jogadores:
              aid = j["atleta_id"]
              nova_foto = foto_map.get(aid)
              if nova_foto and j.get("foto_url") != nova_foto:
                  j["foto_url"] = nova_foto
                  fotos_ok += 1
              novo_status = status_map.get(aid)
              if novo_status is not None and j.get("status_id") != novo_status:
                  j["status_id"] = novo_status
                  status_ok += 1

          with open(path, "w", encoding="utf-8") as f:
              json.dump(jogadores, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Fotos atualizadas: {fotos_ok}")
          print(f"Status atualizados: {status_ok}")
          PYEOF

      - name: Commitar se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet frontend/public/data/jogadores_mercado.json || (
            git add frontend/public/data/jogadores_mercado.json &&
            git commit -m "bot: atualizar status e fotos dos jogadores [skip ci]" &&
            git push
          )
