name: Relatório analytics (mídia kit)

on:
  workflow_dispatch:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analytics.txt

      - name: Instalar dependências
        run: pip install -r requirements-analytics.txt

      - name: Gerar relatório
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ga4-sa.json
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > /tmp/ga4-sa.json
          python automation/relatorio_analytics.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-midia-kit
          path: exports/relatorio_midia_kit.*
